AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

Globals:
  Function:
    Runtime: python3.12
    Environment:
      Variables:
        DYNAMODB_TABLE_NAME: !Ref DynamoDBTable
        S3_BUCKET_NAME: !Sub clauseiq-documents-${Environment}-${AWS::AccountId}
        SQS_QUEUE_URL: !Ref AnalysisQueue
        BEDROCK_REGION: "us-east-1"   # Nova Lite only available in us-east-1 — never use !Ref AWS::Region here
        ENVIRONMENT: !Ref Environment

Resources:

  # ── API Lambda (FastAPI) ──
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: main.handler
      CodeUri: ./api/
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
            COGNITO_USER_POOL_ID: !Ref UserPool
            COGNITO_APP_CLIENT_ID: !Ref UserPoolClient
            PINECONE_SECRET_ARN: !Ref PineconeSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:BatchWriteItem]
              Resource: [!GetAtt DynamoDBTable.Arn, !Sub "${DynamoDBTable.Arn}/index/*"]
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
              Resource: !Sub "${DocumentsBucket.Arn}/*"
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref PineconeSecret
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi

  # ── Dispatcher Lambda (S3 event → SQS) ──
  DispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dispatcher.handler
      CodeUri: ./dispatcher/
      MemorySize: 128
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DynamoDBTable.Arn
            - Effect: Allow
              Action: [sqs:SendMessage]
              Resource: !GetAtt AnalysisQueue.Arn
      Events:
        S3Upload:
          Type: S3
          Properties:
            Bucket: !Ref DocumentsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: documents/
                  - Name: suffix
                    Value: .txt

  # ── AI Worker Lambda (SQS trigger) ──
  AiWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: worker.handler
      CodeUri: ./worker/
      MemorySize: 1024
      Timeout: 600
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:BatchWriteItem]
              Resource: [!GetAtt DynamoDBTable.Arn, !Sub "${DynamoDBTable.Arn}/index/*"]
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub "${DocumentsBucket.Arn}/*"
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref PineconeSecret
      Environment:
        Variables:
          PINECONE_SECRET_ARN: !Ref PineconeSecret
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt AnalysisQueue.Arn
            BatchSize: 1

  # ── User Initializer Lambda (Cognito Post-Confirmation trigger) ──
  UserInitializerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: user_initializer.handler
      CodeUri: ./user_initializer/
      MemorySize: 128
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem]
              Resource: !GetAtt DynamoDBTable.Arn

  # ── S3 Bucket (private) ──
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub clauseiq-documents-${Environment}-${AWS::AccountId}
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${DocumentsBucket.Arn}/*

  # ── S3 Bucket (frontend static files — private, served via CloudFront) ──
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub clauseiq-frontend-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub clauseiq-frontend-oac-${Environment}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD]
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        HttpVersion: http2
        PriceClass: PriceClass_100

  PineconeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub clauseiq-pinecone-${Environment}
      Description: Pinecone API key and index host URL for Bedrock KB vector storage

  # ── DynamoDB Table (single table, PAY_PER_REQUEST) ──
  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub clauseiq-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ── SQS Queue + Dead Letter Queue ──
  AnalysisQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub clauseiq-analysis-${Environment}
      VisibilityTimeout: 610
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalysisDLQ.Arn
        maxReceiveCount: 3

  AnalysisDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub clauseiq-analysis-dlq-${Environment}



  # ── Cognito User Pool ──
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub clauseiq-${Environment}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      LambdaConfig:
        PostConfirmation: !GetAtt UserInitializerFunction.Arn

  CognitoUserInitializerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt UserInitializerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub clauseiq-client-${Environment}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ── API Gateway HTTP API ──
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - https://clauseiq.com
          - http://localhost:5173
        AllowMethods:
          - GET
          - POST
          - DELETE
        AllowHeaders:
          - Authorization
          - Content-Type

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  DynamoDBTableName:
    Value: !Ref DynamoDBTable
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
  FrontendBucketName:
    Value: !Ref FrontendBucket
  CloudFrontURL:
    Value: !Sub https://${FrontendDistribution.DomainName}
  CloudFrontDistributionId:
    Value: !Ref FrontendDistribution
  PineconeSecretArn:
    Value: !Ref PineconeSecret

#Trigger deployment